name: KR screener daily

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pykrx finance-datareader pandas numpy
      - name: Run screener
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python kr_daily_screen.py
      - name: Publish to docs
        run: |
          mkdir -p docs
          cp kr_dashboard.html docs/index.html
          cp kr_screen_data.json docs/data.json 2>/dev/null || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "dashboard update $(date -u +'%Y-%m-%d')"
            git push
          fi
